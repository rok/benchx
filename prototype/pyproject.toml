[project]
name = "benchx-prototype"
version = "0.1.0"
description = "Prototype of the benchx design docs: runner, Google Benchmark adapter, Parquet store, run-mode comparator"
requires-python = ">=3.11"
dependencies = ["pyarrow>=19", "jsonschema>=4.18", "referencing", "rfc8785"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
bx = "benchx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchx"]
